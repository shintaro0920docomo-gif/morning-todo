<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Departure Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* 駅の電光掲示板（LED）の世界観を構築 */
        body { 
            background-color: #000000; 
            color: #ff9f00; 
            font-family: 'Share Tech Mono', monospace; 
            padding: 16px;
        }
        .led-panel { 
            border: 2px solid #222; 
            box-shadow: 0 0 15px rgba(255, 159, 0, 0.15); 
            background-color: #080808;
        }
        /* 現在進行中のタスクの点滅アニメーション */
        .active-task { 
            color: #ffffff !important; 
            text-shadow: 0 0 8px #ffffff, 0 0 15px #ff9f00;
            animation: led-blink 1.5s infinite; 
        }
        /* 終了したタスクのグレーアウト */
        .past-task { 
            color: #222222 !important; 
            text-shadow: none !important;
        }
        @keyframes led-blink { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.4; } 
        }
        /* フォームのiPhoneデフォルトスタイルの打ち消し */
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(62%) sepia(98%) saturate(1514%) hue-rotate(1deg) brightness(103%) contrast(105%);
        }
    </style>
</head>
